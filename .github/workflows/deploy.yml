name: Deploy to GitHub Pages

# Builds docs/config/firebase.js from a repo secret at deploy time, so the
# real Firebase config never has to be a file in the repo (see
# docs/config/firebase.example.js and SETUP.md Part 1). Everything else in
# docs/ ships unmodified — no build step for the game itself, this only
# exists to inject that one file.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write Firebase config from secret
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          node -e "
            const fs = require('fs');
            const cfg = process.env.FIREBASE_CONFIG_JSON;
            if (!cfg) {
              console.log('No FIREBASE_CONFIG secret set — deploying without it; the game falls back to localStorage-only saves.');
              fs.writeFileSync('docs/config/firebase.js',
                'export const firebaseConfig = { apiKey: \"YOUR_API_KEY\" };\nexport default firebaseConfig;\n');
              process.exit(0);
            }
            const parsed = JSON.parse(cfg); // fails loudly if the secret isn't valid JSON
            const content = '// Generated at deploy time from the FIREBASE_CONFIG repo secret — never committed.\nexport const firebaseConfig = ' + JSON.stringify(parsed, null, 2) + ';\nexport default firebaseConfig;\n';
            fs.writeFileSync('docs/config/firebase.js', content);
          "

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
