<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Indiana Jones and the Drowned Bell of Atlantis</title>
<link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="tap-gate">
    <div class="tap-gate-inner">
      <h1 id="tap-gate-title">Indiana Jones and the Drowned Bell of Atlantis</h1>
      <div class="prompt" id="tap-gate-prompt">TAP TO BEGIN<br>點擊開始</div>
      <div class="dedication-wrap" id="tap-gate-dedication"></div>
    </div>
  </div>

  <div id="game-root">
    <div id="sentence-line">Ready.<br>準備就緒。</div>
    <div id="stage-wrap">
      <canvas id="stage"></canvas>
      <div id="hover-tip" hidden></div>
      <div id="transition-fade"></div>
      <div id="offline-badge" hidden>offline — saving locally<br>離線 — 進度存於本機</div>
      <button id="hint-button" aria-label="Get a hint">?</button>
      <button id="reveal-button" aria-label="Show interactive spots">👁</button>
      <button id="menu-button" aria-label="Menu">☰</button>
      <div id="radial-menu"></div>
      <div id="inventory-drawer-handle">🎒</div>
      <div id="inventory-drawer"></div>
      <div id="overlays"></div>
    </div>
    <div id="touch-hint">tap: look/take/walk · hold: verb wheel · 🎒: items<br>點擊：看/拿/走 · 長按：動作輪盤 · 🎒：物品欄</div>
    <div id="control-bar">
      <div id="verb-panel"></div>
      <div id="inventory-panel"></div>
    </div>
  </div>

  <!-- Tone.js: chosen audio engine (design doc Section 3). Loaded before the
       module script so `window.Tone` is guaranteed defined when it runs.
       Every Tone.js call in the codebase is guarded — if this CDN is
       blocked or offline, the game stays fully playable, just silent. -->
  <script src="https://unpkg.com/tone@14.8.49/build/Tone.js"></script>
  <script type="module" src="engine/main.js"></script>
</body>
</html>
